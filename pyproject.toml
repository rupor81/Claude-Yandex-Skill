[project]
name = "yandex-mcp-workspace"
version = "0.1.0"
description = "Yandex MCP connectors: shared core, calendar server, setup CLI."
requires-python = ">=3.13"
dependencies = [
    "yandex-core",
    "yandex-calendar-mcp",
    "yandex-mcp-cli",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
yandex-core = { workspace = true }
yandex-calendar-mcp = { workspace = true }
yandex-mcp-cli = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
# Load the workspace packages from source. The editable installs alone are not
# enough here: on macOS the .pth files intermittently acquire the UF_HIDDEN flag
# and Python 3.13 then skips them, so the suite would fail to import.
pythonpath = [
    "packages/yandex-core/src",
    "packages/yandex-calendar-mcp/src",
    "packages/yandex-mcp-cli/src",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
