[project]
name = "yandex-mcp-workspace"
version = "0.1.0"
description = "Yandex MCP connectors: shared core, calendar server, setup CLI."
requires-python = ">=3.13"
dependencies = [
    "yandex-core",
    "yandex-calendar-mcp",
    "yandex-mail-mcp",
    "yandex-mcp-cli",
    "yandex-remote-mcp",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pyyaml>=6"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
yandex-core = { workspace = true }
yandex-calendar-mcp = { workspace = true }
yandex-mail-mcp = { workspace = true }
yandex-mcp-cli = { workspace = true }
yandex-remote-mcp = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
# Load the workspace packages from source, so the suite imports what is in the
# tree whatever state the installed environment is in. Originally a workaround:
# iCloud hides files in dot-folders under ~/Documents, and Python 3.13 skips a
# hidden .pth. The root cause is fixed now (README, "The environment"); this stays
# because a suite that depends on an install step can pass against a stale one.
pythonpath = [
    # `tests/` so the rules the live suite obeys can be unit-tested without one.
    "tests",
    "packages/yandex-core/src",
    "packages/yandex-calendar-mcp/src",
    "packages/yandex-mail-mcp/src",
    "packages/yandex-mcp-cli/src",
    "packages/yandex-remote-mcp/src",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

# The linter exists because the source already carries `noqa` codes -- BLE001 and
# ANN001 -- that nothing was enforcing. A suppression nobody checks is worse than no
# suppression: it reads as a considered exception when it may be a leftover.
[tool.ruff]
line-length = 88
target-version = "py313"
# `_bmad/` is vendored methodology scaffolding installed by the operator, not our
# source; linting it would report on somebody else's code and drown ours.
extend-exclude = ["_bmad", "_bmad-output", ".venv"]
src = [
    "packages/yandex-core/src",
    "packages/yandex-calendar-mcp/src",
    "packages/yandex-mail-mcp/src",
    "packages/yandex-mcp-cli/src",
    "packages/yandex-remote-mcp/src",
]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # import order
    "UP",          # pyupgrade
    "B",           # bugbear
    "BLE",         # blind except -- the codes already suppressed in the source
    "ANN",         # annotations -- likewise
    "SIM",         # simplify
    "RET",         # return paths
    "PTH",         # pathlib over os.path
    "RUF",
]
ignore = [
    "ANN401",      # deliberate `object` / `Any` at the validation boundary
    "E501",        # long lines are formatter territory, not lint territory
]

[tool.ruff.lint.per-file-ignores]
# Tests name their fakes and fixtures for what they prove, not for a type checker,
# and a fake that swallows an exception is often the point of the test.
# RUF001-003: this connector is for Russian-language accounts, so Cyrillic in test
# data is the data, not a homoglyph slip -- a folder really is called `Входящие`
# and a calendar really is called `Не забыть`. Flagging those would push the suite
# towards transliterated fixtures that no longer resemble the account under test.
"tests/**" = ["ANN", "BLE", "B011", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
