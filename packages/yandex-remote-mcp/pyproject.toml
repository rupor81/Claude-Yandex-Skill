[project]
name = "yandex-remote-mcp"
version = "0.1.0"
description = "Calendar and Mail as one remote MCP connector, signed in with Yandex ID."
requires-python = ">=3.13"
dependencies = [
    "yandex-core",
    "yandex-calendar-mcp",
    "yandex-mail-mcp",
    "mcp>=2",
    "httpx>=0.27",
    "cryptography>=43",
]

[tool.uv.sources]
yandex-core = { workspace = true }
yandex-calendar-mcp = { workspace = true }
yandex-mail-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
